plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.upwell'
version = '0.0.1'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// Override with `upwellPlayAppUpdateVersion` in gradle.properties (or the config plugin option).
def playAppUpdateVersion = project.findProperty('upwellPlayAppUpdateVersion') ?: safeExtGet('upwellPlayAppUpdateVersion', '2.1.0')

android {
  namespace "expo.modules.upwell"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  implementation "com.google.android.play:app-update:${playAppUpdateVersion}"
  testImplementation 'junit:junit:4.13.2'
}
