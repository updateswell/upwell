name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci --coverage
      - run: npm run build
      - run: npm pack --dry-run
        working-directory: packages/upwell

  android:
    name: Android (compile module)
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild --platform android --no-install
        working-directory: example
      - run: ./gradlew :upwell:compileDebugKotlin :upwell:testDebugUnitTest --no-daemon
        working-directory: example/android

  ios:
    name: iOS (compile module)
    runs-on: macos-26
    needs: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild --platform ios
        working-directory: example
      - name: Build for simulator
        working-directory: example/ios
        run: |
          xcodebuild -version
          set -o pipefail
          xcodebuild -workspace upwellexample.xcworkspace -scheme upwellexample \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || {
              grep -E "error:|warning: .*Upwell" build.log | sort -u | head -50
              tail -30 build.log
              exit 1
            }
          grep -E "Upwell.*warning:" build.log | sort -u | head -30 || true
